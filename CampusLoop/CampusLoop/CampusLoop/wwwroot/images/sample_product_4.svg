<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a" rx="16" />
  <!-- Drafting Board Edge -->
  <rect x="50" y="40" width="300" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Clamp at top corner -->
  <rect x="70" y="50" width="30" height="30" rx="4" fill="#475569" stroke="#94a3b8" />
  <circle cx="85" cy="65" r="7" fill="#f59e0b" />
  <!-- Dual Arms -->
  <line x1="85" y1="65" x2="180" y2="130" stroke="url(#metalArm)" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="130" x2="230" y2="180" stroke="url(#metalArm)" stroke-width="6" stroke-linecap="round" />
  <!-- Protractor Head -->
  <circle cx="230" cy="180" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <circle cx="230" cy="180" r="8" fill="#0f172a" />
  <!-- Perpendicular Transparent Acrylic Scales -->
  <rect x="230" y="174" width="90" height="12" rx="2" fill="#bae6fd" opacity="0.8" stroke="#0284c7" />
  <rect x="224" y="90" width="12" height="90" rx="2" fill="#bae6fd" opacity="0.8" stroke="#0284c7" />
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Engineering Mini Drafter</text>
</svg>
