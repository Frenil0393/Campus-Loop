<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a" rx="16" />
  <!-- Calculator Body -->
  <rect x="130" y="30" width="140" height="240" rx="18" fill="url(#calcGrad)" stroke="#4338ca" stroke-width="2" />
  <!-- Screen -->
  <rect x="145" y="50" width="110" height="45" rx="6" fill="url(#screenGrad)" />
  <text x="245" y="80" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">3.14159265</text>
  <!-- Solar cell -->
  <rect x="150" y="105" width="50" height="12" rx="2" fill="#78350f" opacity="0.8" />
  <!-- Buttons -->
  <g fill="#475569" rx="4">
    <rect x="145" y="130" width="22" height="16" rx="3" fill="#6366f1" />
    <rect x="175" y="130" width="22" height="16" rx="3" fill="#6366f1" />
    <rect x="205" y="130" width="22" height="16" rx="3" fill="#6366f1" />
    <rect x="233" y="130" width="22" height="16" rx="3" fill="#ef4444" />

    <rect x="145" y="155" width="22" height="16" rx="3" />
    <rect x="175" y="155" width="22" height="16" rx="3" />
    <rect x="205" y="155" width="22" height="16" rx="3" />
    <rect x="233" y="155" width="22" height="16" rx="3" fill="#f59e0b" />

    <rect x="145" y="180" width="22" height="16" rx="3" />
    <rect x="175" y="180" width="22" height="16" rx="3" />
    <rect x="205" y="180" width="22" height="16" rx="3" />
    <rect x="233" y="180" width="22" height="16" rx="3" fill="#f59e0b" />

    <rect x="145" y="205" width="22" height="16" rx="3" />
    <rect x="175" y="205" width="22" height="16" rx="3" />
    <rect x="205" y="205" width="22" height="16" rx="3" />
    <rect x="233" y="205" width="22" height="16" rx="3" fill="#10b981" />

    <rect x="145" y="230" width="52" height="18" rx="3" />
    <rect x="205" y="230" width="22" height="18" rx="3" />
    <rect x="233" y="230" width="22" height="18" rx="3" fill="#10b981" />
  </g>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Scientific Calculator</text>
</svg>
