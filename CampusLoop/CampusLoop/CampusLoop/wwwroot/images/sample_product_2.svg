<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a" rx="16" />
  <!-- Mouse Pad -->
  <rect x="70" y="40" width="260" height="210" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Mouse Body -->
  <ellipse cx="200" cy="145" rx="55" ry="80" fill="url(#mouseGrad)" stroke="#475569" stroke-width="2" />
  <!-- Left/Right Split -->
  <path d="M 200 65 L 200 120" stroke="#06b6d4" stroke-width="2" />
  <!-- Scroll Wheel -->
  <rect x="194" y="85" width="12" height="24" rx="6" fill="#06b6d4" />
  <!-- LED Glow Ring -->
  <path d="M 160 170 C 175 210 225 210 240 170" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Nano Receiver -->
  <rect x="290" y="70" width="16" height="26" rx="4" fill="#64748b" stroke="#94a3b8" />
  <rect x="293" y="73" width="10" height="6" fill="#e2e8f0" />
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Wireless Ergonomic Mouse</text>
</svg>
