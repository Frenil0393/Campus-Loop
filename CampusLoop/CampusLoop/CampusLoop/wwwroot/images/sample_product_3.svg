<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a" rx="16" />
  <!-- Pages Stack -->
  <polygon points="120,50 260,35 290,230 150,250" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <polygon points="115,55 255,40 285,235 145,255" fill="#f1f5f9" />
  <!-- Book Cover -->
  <polygon points="110,60 250,45 280,240 140,260" fill="url(#bookCover)" stroke="#10b981" stroke-width="2" />
  <!-- Spine Shadow -->
  <line x1="110" y1="60" x2="140" y2="260" stroke="#022c22" stroke-width="6" />
  <!-- Title Box on Cover -->
  <polygon points="135,90 235,79 240,150 140,160" fill="#ffffff" opacity="0.95" rx="4" />
  <text x="185" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#064e3b" text-anchor="middle">ENGINEERING</text>
  <text x="185" y="130" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f766e" text-anchor="middle">MECHANICS</text>
  <text x="185" y="145" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Standard Edition</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Engineering Textbook</text>
</svg>
